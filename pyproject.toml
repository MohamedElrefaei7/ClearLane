[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearlane"
version = "0.0.1"
description = "NYC reported blocked-bike-lane risk map (311-based)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "matplotlib",
    "pyarrow",
    "geopandas",
    "shapely",
    "h3>=4",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the network (Socrata etc.); excluded from the default run",
]
addopts = "-m 'not live'"
